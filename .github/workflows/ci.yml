name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-api.txt
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: mypy
        run: mypy .
      - name: bandit
        run: bandit -c pyproject.toml -r .
      - name: pytest
        run: pytest tests/ -q

  # Validate real binaries and confinement on PRs AND the merged main tree.
  docker:
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t hydra:ci .
      - name: pytest inside container
        run: docker run --rm hydra:ci pytest tests/ -q
      - name: ruff inside container
        run: docker run --rm hydra:ci ruff check .
      - name: black inside container
        run: docker run --rm hydra:ci black --check .
      - name: isort inside container
        run: docker run --rm hydra:ci isort --check-only .
      - name: bandit inside container
        run: docker run --rm hydra:ci bandit -c pyproject.toml -r .
      - name: Network-confinement verification inside container
        run: |
          docker run --rm hydra:ci pytest -v \
            tests/test_httpx_confinement_live.py \
            tests/test_browser_confinement_live.py \
            tests/test_crawler_confinement_live.py
          docker run --rm hydra:ci python -c "
          from core.intel.scope import CollectionScope
          from core.verification.preflight import scope_exclusion_canary_check
          scope = CollectionScope.from_seeds(
              ['stripchat.com'], patterns=['*.stripchat.com', '!mta*.stripchat.com']
          )
          findings = scope_exclusion_canary_check(scope)
          assert findings == [], f'canary check found something broken inside the container: {findings}'
          print('OK: scope_exclusion_canary_check clean inside the container')
          "
