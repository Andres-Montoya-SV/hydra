[project]
name = "hydra"
version = "1.0.0"
description = "Modular bug bounty reconnaissance framework"
requires-python = ">=3.10"
dependencies = [
    "certifi==2026.7.22",
    "python-dotenv==1.2.2",
    "rich==13.9.4",
]

# Dev-tool versions are pinned in EXACTLY ONE place: `requirements-dev.txt`
# — the file `.github/workflows/ci.yml`'s `check` job actually installs
# from (`pip install -r requirements-dev.txt -r requirements-api.txt`)
# and the file `docs/DOCKER.md`/`docs/PAID_API_DESIGN.md` document as the
# real local-dev install path. There used to be a SECOND, hand-maintained
# copy of the same pins here as a `[project.optional-dependencies]` `dev`
# extra — confirmed dead: this project has no `[build-system]` table, so
# `pip install .[dev]`/`pip install -e .[dev]` was never actually a
# supported install path for anyone, CI included. A duplicate pin nobody
# installs from is pure drift risk with no corresponding benefit, so it's
# removed rather than kept in sync by hand — see
# `tests/test_dev_toolchain_pins_agree.py` for the guard against the
# remaining real duplication (`.pre-commit-config.yaml`'s hook `rev`s,
# which DO need to match `requirements-dev.txt` exactly for a
# contributor's local `pre-commit run` to be the same toolchain CI runs).

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/(\\.venv|output|logs)/"

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "output", "logs"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "output", "logs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "N"]
ignore = [
    "E501",  # black owns wrapping
    "S310",  # urllib used for explicit HTTP(S) probes
    "S311",  # PRNG for canary names/ports, not cryptography
]

[tool.ruff.lint.per-file-ignores]
# S104: SSRF-matrix tests use "0.0.0.0"/other bind-all-looking strings as
#   pure classify_ip() test data, never to actually bind a socket.
# S301: pickle is used exactly to prove AuthorizedCollectionTarget can't be
#   forged via deserialization — the point of that test, not untrusted input.
# B017: a frozen dataclass's exact exception type on illegal mutation isn't
#   guaranteed across Python versions; asserting "some exception" is correct.
"tests/*" = ["S101", "S104", "S105", "S108", "S301", "B017"]
"app.py" = ["E402"]
"core/store.py" = ["S608"]
# B008: FastAPI's dependency-injection convention IS `= Depends(...)` in
#   an argument default — that's how the framework recognizes a
#   dependency, not a real "mutable default"/eager-call bug.
"api/routers/*.py" = ["B008"]
"modules/naabu.py" = ["S105"]  # probe_pass is not a password

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["(?x)(tests/|\\.venv/|output/|logs/)"]

[[tool.mypy.overrides]]
module = ["app", "config.*", "core.*", "modules.*", "ui.*", "utils.*"]
ignore_errors = true

# Hardening round 2 (Task 3): incremental, security-priority-ordered
# opt-in to real type checking, carved out of the blanket ignore above.
# mypy applies the last matching override for a given module, so each
# entry below re-enables checking for exactly that module without
# touching the broad exemption everything else still has. Each module
# here was fixed to pass real checking (no bare `# type: ignore`) before
# being added — see docs/HARDENING_ROUND2_P1.md for every fix and why.
# Expand this list incrementally in future rounds; do not widen the
# blanket ignore instead of adding entries here.
[[tool.mypy.overrides]]
module = [
    "core.intel.authorize",
    "core.scope",
    "core.intel.scope",
    "core.collection.audit",
    "core.collection.crawler_proxy",
    "core.collection.gateway",
    "core.collection.ssrf",
    "core.collection.target",
    "core.collection.whois_client",
    "core.store",
    "core.verification.detectors",
    "core.verification.grounding",
    "core.verification.model",
    "core.verification.postmodule",
    "core.verification.preflight",
    "config.settings",
]
ignore_errors = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
